<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <main class="mx-auto">
      <!-- navbar -->
      <div class="bg-[#F9F1E7] h-24">
        <p>Home</p>
      </div>
      <!-- product -->
      <div class="py-8 flex mx-auto max-w-6xl">
        <div class="grid grid-cols-2 gap-28">
          <div class="flex gap-8">
            <div class="flex flex-col gap-8">
              <div class="w-20 h-20 rounded-lg overflow-hidden">
                <img
                  class="object-cover"
                  src="img/imgdetail/image.png"
                  alt="" />
              </div>
              <div class="w-20 h-20 rounded-lg overflow-hidden">
                <img
                  class="object-cover"
                  src="img/imgdetail/image.png"
                  alt="" />
              </div>
              <div class="w-20 h-20 rounded-lg overflow-hidden">
                <img
                  class="object-cover"
                  src="img/imgdetail/image.png"
                  alt="" />
              </div>
              <div class="w-20 h-20 rounded-lg overflow-hidden">
                <img
                  class="object-cover"
                  src="img/imgdetail/image.png"
                  alt="" />
              </div>
            </div>
            <div class="h-[500px] overflow-hidden">
              <img class="object-cover" src="img/imgdetail/image.png" alt="" />
            </div>
          </div>
          <div class="flex flex-col gap-4">
            <h1 class="text-4xl">Asgaard sofa</h1>
            <span class="text-2xl text-[#9F9F9F]">200.000đ</span>
            <p>
              Setting the bar as one of the loudest speakers in its class, the
              Kilburn is a compact, stout-hearted hero with a well-balanced
              audio which boasts a clear midrange and extended highs for a
              sound.
            </p>
            <p class="text-[#9F9F9F]">Size</p>
            <div class="flex gap-3">
              <button
                class="bg-[#B88E2F] w-[30px] h-[30px] text-white rounded-md">
                L
              </button>
              <button
                class="bg-[#F9F1E7] w-[30px] h-[30px] focus:text-white rounded-md">
                XL
              </button>
              <button
                class="bg-[#F9F1E7] w-[30px] h-[30px] focus:text-white rounded-md">
                XS
              </button>
            </div>
            <p class="text-[#9F9F9F]">Color</p>
            <div class="flex gap-3">
              <button
                class="bg-[#816DFA] w-[30px] h-[30px] text-white rounded-full"></button>
              <button
                class="bg-black w-[30px] h-[30px] text-white rounded-full"></button>
              <button
                class="bg-[#B88E2F] w-[30px] h-[30px] text-white rounded-full"></button>
            </div>
            <div>
              <input type="number" />
              <button>Add To Cart</button>
              <button>Compare</button>
            </div>
            <div></div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
